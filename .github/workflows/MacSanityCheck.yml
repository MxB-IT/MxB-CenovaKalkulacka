name: Mac Visual Sanity Check

on: workflow_dispatch

jobs:
  screenshot-test:
    runs-on: macos-14 # Use Apple Silicon runner

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run App and Capture Screenshot
      run: |
        echo "Starting application in background..."
        python PriceCalc.py > /dev/null 2>&1 &
        
        APP_PID=$!

        echo "Waiting for GUI to initialize (10 seconds)..."
        sleep 10

        echo "Capturing screen..."
        screencapture -x -r -t jpg screenshot-mac.jpg

        echo "Killing application process $APP_PID..."
        kill $APP_PID || true

    - name: Upload Screenshot Artifact
      if: always() 
      uses: actions/upload-artifact@v4
      with:
        name: macOS-Sanity-Check-Image
        path: screenshot-mac.jpg
